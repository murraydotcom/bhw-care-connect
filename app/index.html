    <!--
      All type is self-hosted — a patient-facing page shouldn't hand every
      visitor's IP to a font CDN. Playfair Display and Caveat are embedded in
      src/styles/fonts.css by the design system; Montserrat, Lora and Dancing
      Script are in src/styles/webfonts.css + src/fonts/.
    -->

    <script>
      // Resolve the theme before first paint so Light opal / Black opal never flashes.
      // Mirrors useTheme() in src/lib/useTheme.ts — keep the storage key in sync.
      ;(function () {
        try {
          var saved = localStorage.getItem('bhw-cc-theme')
          var theme =
            saved ||
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>

    <!--
      Local-business structured data — this is what puts the practice into
      Google's local pack / map results and feeds AI answer engines.
      ⚠️ NAP MUST MATCH the Google Business Profile EXACTLY. Confirm/adjust:

        • geo latitude/longitude (approximate — copy the exact pin from GBP)
        • openingHours (placeholder Mon–Fri 9–5)
        • areaServed county list
        • add the Google Business Profile URL + any social profiles to "sameAs"
    -->
