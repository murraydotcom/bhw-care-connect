<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BHW Care Connect — Baltimore Healthcare &amp; Wellness</title>
    <meta
      name="description"
      content="One page for reaching your BHW care team, finding a resource, or opening your Personal Health Blueprint."
    />
    <link rel="canonical" href="https://mybhw.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BHW Care Connect" />
    <meta property="og:title" content="BHW Care Connect" />
    <meta property="og:description" content="Patient care, programs, and Health Core — connected." />
    <meta property="og:url" content="https://mybhw.com/" />
    <meta property="og:image" content="https://mybhw.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BHW Care Connect in the Opal &amp; Ironstone patient design system" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BHW Care Connect" />
    <meta name="twitter:description" content="Patient care, programs, and Health Core — connected." />
    <meta name="twitter:image" content="https://mybhw.com/og.png" />
    <meta name="theme-color" content="#F8F6F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1822" media="(prefers-color-scheme: dark)" />

    <!--
      All type is self-hosted — a patient-facing page shouldn't hand every
      visitor's IP to a font CDN. Playfair Display and Caveat are embedded in
      src/styles/fonts.css by the design system; Montserrat, Lora and Dancing
      Script are in src/styles/webfonts.css + src/fonts/.
    -->

    <script>
      // Resolve the theme before first paint so Light opal / Black opal never flashes.
      // Mirrors useTheme() in src/lib/useTheme.ts — keep the storage key in sync.
      ;(function () {
        try {
          var saved = localStorage.getItem('bhw-cc-theme')
          var theme =
            saved ||
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
