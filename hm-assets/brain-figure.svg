<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300">
  <defs>
    <linearGradient id="brain" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FCEFE4"/>
      <stop offset="38%" stop-color="#F2D6C1"/>
      <stop offset="72%" stop-color="#E6B79C"/>
      <stop offset="100%" stop-color="#D89A80"/>
    </linearGradient>
    <radialGradient id="bsheen" cx="40%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cerebrum -->
  <path fill="url(#brain)" stroke="#C0876A" stroke-width="1.4"
    d="M60 150
       C52 96 96 52 158 52
       C214 52 258 82 258 128
       C258 150 250 166 234 174
       C240 186 234 200 218 200
       C210 210 196 208 190 198
       C180 210 164 214 148 212
       C120 210 96 202 82 186
       C66 190 56 178 58 160
       C58 156 58 153 60 150 Z"/>

  <!-- cerebellum -->
  <path fill="url(#brain)" stroke="#C0876A" stroke-width="1.3"
    d="M214 196 C236 196 252 206 250 220 C248 236 230 244 212 240 C200 237 196 224 200 212 C203 202 208 198 214 196 Z"/>
  <!-- brain stem -->
  <path fill="url(#brain)" stroke="#C0876A" stroke-width="1.3"
    d="M196 208 C200 224 202 244 198 262 C196 272 188 274 184 264 C180 246 182 224 186 206 Z"/>

  <!-- sheen -->
  <ellipse cx="140" cy="110" rx="86" ry="64" fill="url(#bsheen)"/>

  <!-- gyri (folds) -->
  <g fill="none" stroke="#BC8467" stroke-width="1.5" opacity=".4" stroke-linecap="round">
    <path d="M84 120 Q104 104 96 132 Q112 120 108 146"/>
    <path d="M120 96 Q140 82 132 110 Q150 98 144 126 Q162 116 156 142"/>
    <path d="M170 92 Q190 80 184 108 Q204 98 198 126"/>
    <path d="M214 100 Q232 92 226 118 Q244 112 236 138"/>
    <path d="M96 158 Q118 150 110 172 Q132 166 124 186"/>
    <path d="M150 160 Q172 154 164 176 Q186 172 178 190"/>
  </g>

  <!-- neurotransmitter pathways + nodes -->
  <g stroke-dasharray="2 4" stroke-width="1.3" fill="none" opacity=".55">
    <path d="M150 150 L150 92" stroke="#7E5AA6"/>
    <path d="M150 150 L188 176" stroke="#C77FB0"/>
    <path d="M150 150 L176 206" stroke="#6E86C4"/>
  </g>
  <g>
    <!-- dopamine (midbrain) -->
    <circle cx="150" cy="150" r="15" fill="url(#node)"/><circle cx="150" cy="150" r="5.5" fill="#7E5AA6" stroke="#fff" stroke-width="1.6"/>
    <!-- GABA (cortex) -->
    <circle cx="150" cy="90" r="13" fill="url(#node)"/><circle cx="150" cy="90" r="5" fill="#57A08F" stroke="#fff" stroke-width="1.6"/>
    <!-- norepinephrine (pons) -->
    <circle cx="188" cy="176" r="13" fill="url(#node)"/><circle cx="188" cy="176" r="5" fill="#6E86C4" stroke="#fff" stroke-width="1.6"/>
    <!-- serotonin (raphe / stem) -->
    <circle cx="176" cy="208" r="13" fill="url(#node)"/><circle cx="176" cy="208" r="5" fill="#C77FB0" stroke="#fff" stroke-width="1.6"/>
  </g>
</svg>
