[build]
  command = "cd app && npm ci && npm run build && cd .. && node build-merge.mjs"
  publish = "app/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# BHW Care Connect — the public, patient-facing site. Employee tools
# (BHW HQ / crewOS) live in the separate bhwcrewos repo and deploy; this
# site links to none of them by design.
#
#   /                                → Care Connect hub (app/ React build)
#   /bhw-patient-portal-mockup.html  → Personal Health Blueprint
#   /bhw-charmed-patient-mockup.html → CharmEd program page
#   /bhw-flow-patient-mockup.html    → Flow program page
#   /bhw-mindmood-patient-mockup.html→ Mind & Mood program page
#
# Care Connect health dashboards (pages/ + fonts/ + hm-assets/, merged in):
#   /bhw-dashboards.html   → dashboards index (links all of the below)
#   /bhw-overview.html     → General Overview (program re-skins via ?p=)
#   /bhw-cardio.html       → Cardiovascular (Primary-Care-style summary)
#   /bhw-flow.html /bhw-gi.html /bhw-msk.html /bhw-respiratory.html
#   /bhw-neuro.html /bhw-immune.html /bhw-endocrine.html → per-system deep pages
#   Patient body / hologram artwork drops into hm-assets/ (see hm-assets/README.txt)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
